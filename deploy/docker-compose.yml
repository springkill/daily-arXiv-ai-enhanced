# 自托管前端容器。仅托管静态站点 + 本机每日生成的 data/。
# 不发布宿主端口 —— 由你自己的反向代理(nginx / caddy / traefik)按域名接进来。
# 若你没有现成的网关,把下面 networks 换成端口映射即可:ports: ["8080:80"]。
services:
  web:
    image: nginx:1.27-alpine
    container_name: daily-arxiv-web
    restart: unless-stopped
    volumes:
      # 整个仓库作为站点根(只读);data/ 与 assets/ 由宿主流水线写入,实时可见
      - ../:/usr/share/nginx/html:ro
      # 用模板而不是直接挂 conf:后端地址按各人的 docker 网桥不同,
      # 交给 nginx 镜像自带的 envsubst 渲染,不用改文件
      - ./web.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      # 宿主机上 arxiv-api 的地址。`docker network inspect <网络名>` 看 Gateway,
      # 常见 172.17.0.1(默认 bridge)。要和 arxiv-api 的 REVIEW_BIND 一致。
      API_UPSTREAM: "${API_UPSTREAM:-172.17.0.1:8801}"
      # 只替换这一个变量,别把 nginx 自己的 $host/$remote_addr 也换掉
      NGINX_ENVSUBST_FILTER: "API_UPSTREAM"
    networks:
      - gateway

  # 「已标记」+「一键审稿」的后端不在这里 —— 它跑在宿主机上(deploy/api/server.py,
  # systemd 用户级单元 arxiv-api.service),因为要用本机已登录的 claude CLI。
  # web 容器把 /api/ 反代到宿主机(见 web.conf 里的 proxy_pass,IP 按你的 docker 网桥改)。

networks:
  # 复用你自己已有的反代网络;没有就先 `docker network create gateway`
  gateway:
    external: true

