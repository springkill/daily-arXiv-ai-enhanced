# 自托管前端容器:由现有的 nginx-gateway 反代 arxiv.example.com → 此容器
# 仅托管静态站点 + 本机每日生成的 data/。不暴露宿主端口,只在 gateway 网络内部可达。
services:
  web:
    image: nginx:1.27-alpine
    container_name: daily-arxiv-web
    restart: unless-stopped
    volumes:
      # 整个仓库作为站点根(只读);data/ 与 assets/ 由宿主流水线写入,实时可见
      - ../:/usr/share/nginx/html:ro
      - ./web.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gateway

  # 跨设备"已标记论文"API(单用户,前置 nginx basic auth)。web 容器把 /api/ 反代到这里。
  marks-api:
    image: python:3.10-slim          # 本地已有镜像,避免拉取(Docker Hub 受 VPN 干扰)
    container_name: daily-arxiv-marks
    restart: unless-stopped
    command: python /app/server.py
    volumes:
      - ./marks-api:/app:ro          # 目录挂载,避免单文件 inode 陷阱
      - marks-data:/data             # 标记数据持久化(命名卷,不进 git、不被 nginx 托管)
    networks:
      - gateway

networks:
  gateway:
    external: true

volumes:
  marks-data:
