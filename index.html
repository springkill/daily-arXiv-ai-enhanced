<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Daily arXiv AI Enhanced — 每日 arXiv 论文的 AI 增强阅读器">
    <title>Daily arXiv AI Enhanced</title>
    <link rel="icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <link rel="shortcut icon" type="image/png" href="assets/logo2-removebg-preview.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="manifest.webmanifest">

    <!-- 必须同步、且排在样式表之前:首屏绘制前定好主题,否则深色用户会闪一帧白 -->
    <script src="js/theme.js"></script>

    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/compromise@14.14.4/builds/compromise.js"></script>

    <script src="js/auth-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data-config.js"></script>
    <script>Auth.requireAuth();</script>
</head>
<body>
<a class="skip-link" href="#viewRoot">跳到主要内容</a>

<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="#/papers">
            <img src="assets/logo2-removebg-preview.png" alt="" class="brand-logo">
            <span class="brand-name">Daily arXiv</span>
        </a>

        <nav class="tabs" id="mainTabs" aria-label="主导航">
            <a class="tab" href="#/papers"   data-route="papers">论文</a>
            <a class="tab" href="#/marked"   data-route="marked">已标记<span class="tab-badge" id="markedCount" data-zero="true">0</span></a>
            <a class="tab" href="#/stats"    data-route="stats">统计</a>
            <a class="tab" href="#/settings" data-route="settings">设置</a>
        </nav>

        <div class="topbar-right">
            <button id="dateChip" class="date-chip" type="button" title="选择日期或日期范围">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zm0 16H5V9h14v11z"/></svg>
                <span id="dateChipLabel">加载中…</span>
            </button>
            <button id="themeToggle" class="icon-btn" type="button" title="切换主题" aria-label="切换主题"></button>
            <button id="logoutButton" class="icon-btn" type="button" title="退出登录" hidden>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.59L17 17l5-5-5-5zM4 5h8V3H4a2 2 0 00-2 2v14a2 2 0 002 2h8v-2H4V5z"/></svg>
            </button>
        </div>
    </div>

    <!-- 各视图自己的工具行。只有当前视图的那一条会显示。 -->
    <div class="subbar" id="subbar">
        <div class="subbar-slot" data-for="papers">
            <div class="chip-row" id="categoryFilter" role="group" aria-label="分类筛选">
                <button class="chip is-on" data-category="all">全部</button>
            </div>
            <div class="subbar-right">
                <div class="search-box">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 105.07 13.07l3.68 3.68a1 1 0 001.41-1.41l-3.68-3.68A7.5 7.5 0 0010.5 3zm0 2a5.5 5.5 0 110 11 5.5 5.5 0 010-11z"/></svg>
                    <input id="textSearchInput" type="search" placeholder="搜索标题、摘要、作者…" aria-label="搜索论文">
                    <button id="textSearchClear" class="clear-x" type="button" title="清空" hidden>&times;</button>
                </div>
                <span class="subbar-note" id="paperCount"></span>
                <button id="sortToggle" class="chip" type="button" title="排序方式:相关度 / 日期">相关度</button>
            </div>
        </div>
        <div class="subbar-slot" data-for="papers-filters">
            <div class="chip-row" id="filterTags" aria-label="关键词与作者筛选"></div>
        </div>
        <div class="subbar-slot" data-for="stats">
            <div class="chip-row" id="statsPresets" role="group" aria-label="时间范围">
                <span class="subbar-label">时间范围</span>
                <button type="button" class="chip" data-days="7">近 7 天</button>
                <button type="button" class="chip" data-days="14">近 14 天</button>
                <button type="button" class="chip" data-days="30">近 30 天</button>
                <button type="button" class="chip" data-days="0">全部</button>
            </div>
            <div class="subbar-right"><span class="subbar-note" id="statsRangeNote"></span></div>
        </div>
    </div>
</header>

<main id="viewRoot" class="view-root">

    <!-- ============ 论文 ============ -->
    <section id="view-papers" class="view" hidden>
        <div class="paper-container" id="paperContainer">
            <div class="loading-container"><div class="loading-spinner"></div><p>加载论文中…</p></div>
        </div>
    </section>

    <!-- ============ 已标记 ============ -->
    <section id="view-marked" class="view" hidden>
        <div class="view-head">
            <h1>已标记的论文</h1>
            <p>在任意设备上标记的论文都会出现在这里,点星号可取消标记。</p>
        </div>
        <div class="marked-toolbar" id="markedToolbar"></div>
        <div id="markedList" class="marked-list">
            <div class="empty-state">加载中…</div>
        </div>
    </section>

    <!-- ============ 统计 ============ -->
    <section id="view-stats" class="view" hidden>
        <div id="papersList"></div>
    </section>

    <!-- ============ 设置 ============ -->
    <section id="view-settings" class="view" hidden>
        <div class="view-head">
            <h1>设置</h1>
            <p>关注的关键词和作者会在论文列表里高亮,并可用于筛选。保存在本机浏览器。</p>
        </div>

        <div class="settings-grid">
            <section class="panel">
                <div class="panel-head">
                    <h2>关注的关键词</h2>
                    <button id="copyKeywords" class="btn btn-ghost btn-sm" type="button">复制</button>
                </div>
                <div class="panel-body">
                    <div class="selected-tags" id="selectedKeywords">
                        <div class="empty-tag-message" id="emptyTagMessage">还没有关键词。在下面添加。</div>
                    </div>
                    <div class="tag-input-row">
                        <input type="text" id="keywordInput" class="input" placeholder="输入关键词后回车…">
                        <button id="addKeyword" class="btn btn-primary" type="button">添加</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head">
                    <h2>关注的作者</h2>
                    <button id="copyAuthors" class="btn btn-ghost btn-sm" type="button">复制</button>
                </div>
                <div class="panel-body">
                    <div class="selected-tags" id="selectedAuthors">
                        <div class="empty-tag-message" id="emptyAuthorMessage">还没有作者。在下面添加。</div>
                    </div>
                    <div class="tag-input-row">
                        <input type="text" id="authorInput" class="input" placeholder="输入作者名后回车…">
                        <button id="addAuthor" class="btn btn-primary" type="button">添加</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-head"><h2>外观</h2></div>
                <div class="panel-body">
                    <div class="radio-row" id="themeChoice" role="radiogroup" aria-label="主题">
                        <button class="chip" type="button" data-theme-pref="light">浅色</button>
                        <button class="chip" type="button" data-theme-pref="dark">深色</button>
                        <button class="chip" type="button" data-theme-pref="system">跟随系统</button>
                    </div>
                </div>
            </section>
        </div>

        <div class="settings-actions">
            <button id="resetSettings" class="btn btn-ghost" type="button">恢复默认</button>
            <button id="saveSettings" class="btn btn-primary" type="button">保存设置</button>
        </div>
    </section>
</main>

<footer class="site-footer">
    <p>内容由 AI 生成,请自行甄别。&copy; 2025 daily-arXiv-ai-enhanced</p>
</footer>

<!-- ============ 日期选择弹层(论文页与统计页共用) ============ -->
<div class="modal-scrim" id="datePickerModal" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="dpTitle">
        <div class="modal-head">
            <h2 id="dpTitle">选择日期</h2>
            <button class="icon-btn" id="dpClose" type="button" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body">
            <input type="text" id="datepicker" placeholder="选择日期" data-input>
            <label class="switch-row">
                <span>日期范围</span>
                <span class="switch"><input type="checkbox" id="dateRangeMode"><span class="switch-track"></span></span>
            </label>
            <div class="chip-row" id="datePresets">
                <button type="button" class="chip" data-days="1">最新一天</button>
                <button type="button" class="chip" data-days="7">近 7 天</button>
                <button type="button" class="chip" data-days="30">近 30 天</button>
                <button type="button" class="chip" data-days="0">全部</button>
            </div>
        </div>
    </div>
</div>

<!-- ============ 论文详情 ============ -->
<div class="modal-scrim" id="paperModal" hidden>
    <div class="modal modal-lg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
            <h2 id="modalTitle">详情</h2>
            <button id="closeModal" class="icon-btn" type="button" aria-label="关闭">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-foot">
            <div class="modal-foot-left">
                <div class="review-launch" role="group" aria-label="一键审稿">
                    <span class="review-launch-label">一键审稿</span>
                    <button class="chip" type="button" data-review-mode="quick"  title="Haiku · 约 20 秒">快速</button>
                    <button class="chip" type="button" data-review-mode="normal" title="Sonnet · 约 1 分钟">正常</button>
                    <button class="chip" type="button" data-review-mode="deep"   title="Opus · 数分钟">深度</button>
                </div>
                <span id="paperPosition" class="hint"></span>
            </div>
            <div class="modal-foot-right">
                <a id="pdfLink" href="#" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">PDF</a>
                <a id="htmlLink" href="#" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">HTML</a>
                <a id="paperLink" href="#" target="_blank" rel="noopener" class="btn btn-primary btn-sm">arXiv</a>
            </div>
        </div>
    </div>
</div>

<!-- ============ 统计页:关键词相关论文侧栏 ============ -->
<aside id="paperSidebar" class="sidebar">
    <div class="sidebar-head">
        <h3 id="selectedKeyword"></h3>
        <button class="icon-btn close-sidebar" type="button" aria-label="关闭">&times;</button>
    </div>
    <div class="sidebar-body" id="relatedPapers"></div>
</aside>

<button id="backToTop" class="back-to-top" type="button" title="回到顶部" hidden>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 14l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/marks.js"></script>
<script src="js/trend-chart.js"></script>
<script src="js/app.js?v=2.1.0"></script>
<script src="js/statistic.js?v=2.0.0"></script>
<script src="js/settings.js?v=2.0.0"></script>
<script src="js/marked-page.js?v=2.1.0"></script>
<script src="js/shell.js?v=2.0.0"></script>
</body>
</html>
