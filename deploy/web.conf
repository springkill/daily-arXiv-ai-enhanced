# 静态站点:前端 SPA + 本机生成的 data/ 与 assets/(由宿主流水线写入)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 拒绝访问隐藏文件(.git / .env.local 等)
    location ~ /\. {
        deny all;
    }
    # 不对外提供后端脚本与依赖清单
    location ~* \.(sh|py|toml|lock|cfg)$ {
        deny all;
    }
    # 整个仓库就是站点根,所以运行时数据目录必须显式挡掉 ——
    # var/store.sqlite3 里是标记和审稿意见,不能让人直接下载走。
    location ^~ /var/ {
        deny all;
    }
    location ~* \.(sqlite3|sqlite|db)$ {
        deny all;
    }
    # 后端源码同理(deploy/ 下有 server.py / store.py 和 compose 文件)
    location ^~ /deploy/ {
        deny all;
    }

    # 后端 API(已标记 + 一键审稿)→ 跑在**宿主机**上的 arxiv-api。
    # 它要调用你本机已登录的 Claude Code / Codex CLI,塞进容器还得装 node + 挂凭据,
    # 不值当。所以这里代理到 docker 网桥上的宿主地址。
    #
    # ⚠️ 换机器要改这个 IP:`docker network inspect <你的网络名>` 看 Gateway,
    #    常见是 172.17.0.1(默认 bridge)或 172.2x.0.1(自建网络)。
    #    同时把 arxiv-api 的 REVIEW_BIND 设成同一个地址。
    location /api/ {
        proxy_pass http://172.22.0.1:8801;
        proxy_set_header Host $host;
        # 用户身份由网关那层的 basic auth 决定,这里只做透传。
        # 客户端自己带的 X-Auth-User 在网关already被 $remote_user 覆盖掉了。
        proxy_set_header X-Auth-User $http_x_auth_user;
        # 深度模式走 Opus,单次可能几分钟
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # PWA manifest 正确 MIME
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # 数据文件:不缓存,保证每天更新即时可见
    location /data/ {
        add_header Cache-Control "no-cache";
    }
    location = /assets/file-list.txt {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
