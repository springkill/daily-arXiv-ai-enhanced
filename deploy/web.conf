# 静态站点:前端 SPA + 本机生成的 data/ 与 assets/(由宿主流水线写入)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 拒绝访问隐藏文件(.git / .env.local 等)
    location ~ /\. {
        deny all;
    }
    # 不对外提供后端脚本与依赖清单
    location ~* \.(sh|py|toml|lock|cfg)$ {
        deny all;
    }

    # 已标记 API → marks-api 容器(用 docker DNS 运行时解析,容器临时重启不致网关启动失败)
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $marks_upstream daily-arxiv-marks;
        proxy_pass http://$marks_upstream:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 15s;
    }

    # PWA manifest 正确 MIME
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # 数据文件:不缓存,保证每天更新即时可见
    location /data/ {
        add_header Cache-Control "no-cache";
    }
    location = /assets/file-list.txt {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
